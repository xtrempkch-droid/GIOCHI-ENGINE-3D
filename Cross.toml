# Cross-compilation settings for `cross` (https://github.com/cross-rs/cross).
#
# The engine builds SDL2 from source (`sdl2` feature `bundled`), so no
# prebuilt SDL2 packages are required inside the container. The system
# libraries below are needed by SDL2's audio/input backends on ARM64.

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:0.2.5"
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install -y --no-install-recommends libasound2-dev:arm64 libudev-dev:arm64",
]
