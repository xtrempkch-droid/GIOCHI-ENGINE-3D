[package]
name = "giochi-engine"
description = "GIOCHI-ENGINE core: a C-shaped 2D game engine built on SDL2"
version.workspace = true
edition.workspace = true
rust-version = "1.86"   # see the comment on the workspace value
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
sdl2 = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
notify = { workspace = true, optional = true }
# Phase 20/21. `default-features` stays on: the only default feature is `default_fonts`,
# and a console or a menu without a font is not a console or a menu.
egui = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
# The hot reload example prints what it reloaded; without a logger the demonstration is
# silent even though it works.
env_logger = { workspace = true }

[[bench]]
name = "sprites_2d"
harness = false

# Phase 18b: per-frame engine overhead, so a frame-budget regression can be attributed
# to the engine rather than to the content that happens to be on screen.
[[bench]]
name = "engine_overhead"
harness = false

# Phase 19. A texture reload needs a real renderer and a real file, so it only makes
# sense when the module exists; `required-features` keeps `cargo test` from failing to
# find `hot_reload` in a build that does not have it.
[[test]]
name = "hot_reload_render"
required-features = ["hot_reload"]

# Phase 20. Needs the devtools feature for the whole `devtools` module to exist.
[[test]]
name = "devtools_render"
required-features = ["devtools"]

# Phase 21. The scene UI needs the widgets, the theme and the backend.
[[test]]
name = "ui_render"
required-features = ["devtools"]

[[example]]
name = "ui_demo"
path = "examples/ui_demo.rs"
required-features = ["devtools"]

[[example]]
name = "devtools_demo"
path = "examples/devtools_demo.rs"
required-features = ["devtools"]

[[example]]
name = "hot_reload_demo"
path = "examples/hot_reload_demo.rs"
required-features = ["hot_reload"]

[features]
# Compila o SDL2 do código-fonte — o padrão, e o que o CI usa em x86_64.
default = ["sdl2-bundled"]
sdl2-bundled = ["sdl2/bundled"]
# Usa o SDL2 do sistema via pkg-config. É o caminho para embarcado, cuja imagem
# já traz o SDL2 com KMSDRM — e é o que permite cross-compilar para aarch64 sem
# compilar uma segunda cópia da biblioteca.
sdl2-system = ["sdl2/use-pkgconfig"]
# Fase 15: coleta de tempos/contadores por frame e overlay de debug (F1).
# Desligada por omissão: sem esta feature o profiler compila como no-op e o
# renderer não incrementa contadores (ADR-042).
profiling = []
# Fase 19: recarrega texturas (e, no crate 3D, shaders e malhas) quando o arquivo
# muda no disco. A feature traz o `notify`; desligada, o módulo `hot_reload` inteiro
# não é compilado e o `Engine` não tem nenhum campo novo.
hot_reload = ["dep:notify"]
# Fase 20: consola in-game (F2), draw de debug (F3) e overlay expandido (F1).
# Traz o `egui`; sem a feature a consola, o draw de debug e o módulo `ui` inteiro não
# existem.
devtools = ["dep:egui"]
