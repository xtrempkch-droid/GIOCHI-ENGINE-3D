# `sdl2-sys` needs the cargo `deps` directories to exist before its build script runs;
# see `scripts/create-cargo-deps-dirs.sh`. The workflows run `rustup show`, so this file
# is the one place the channel and the components live.
[toolchain]
channel = "stable"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
