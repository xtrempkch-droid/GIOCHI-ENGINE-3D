# rustfmt configuration — only stable options are used so that
# `cargo fmt --check` stays warning-free on the stable toolchain.
edition = "2021"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
reorder_imports = true
reorder_modules = true
