[package]
name = "giochi-engine-lua"
description = "Lua (5.4) binding for GIOCHI-ENGINE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Same forwarding as the 3D crate: the SDL2 choice belongs to the caller, and an
# implicit default here would win the feature union for every Lua host.
giochi-engine = { path = "../giochi-engine", version = "0.3.1", default-features = false }
mlua = { workspace = true }

[features]
default = ["sdl2-bundled"]
sdl2-bundled = ["giochi-engine/sdl2-bundled"]
sdl2-system = ["giochi-engine/sdl2-system"]
