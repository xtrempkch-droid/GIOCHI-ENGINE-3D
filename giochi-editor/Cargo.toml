[package]
name = "giochi-editor"
description = "Visual scene editor for GIOCHI-ENGINE (Salto B, phases 30-40)"
# The editor is part of the same release as the engine: one product, one version.
# A separate 0.1.0 made `giochi-editor --version` disagree with the engine it ships
# and gave the package folder a version no other artefact had.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# The editor consumes the engine; it never forks it. `devtools` brings the egui
# backend and the in-game console, `hot_reload` is what makes editing shaders and
# textures bearable (phase 19 / R8 of the plan).
giochi-engine = { path = "../giochi-engine", version = "0.5.1", features = ["devtools", "hot_reload"] }
# Phase 31. The viewport needs the scene format and the 3D math (`Camera3D`); it does
# not need the GL renderer, which is why the crate is a dependency and not a second
# window (ADR-064).
giochi-engine-3d = { path = "../giochi-engine-3d", version = "0.5.1", default-features = false }
# Matrix and vector math for the viewport camera. The same `glam` version the 3D crate
# uses, reached directly so the editor does not depend on how the 3D crate wraps it.
glam = { workspace = true }
# Same egui the engine paints with. Two versions would mean two type systems for
# the same frame, which cannot compile.
egui = { workspace = true }
# Events and keycodes: the editor reads SDL directly because it owns its loop.
sdl2 = { workspace = true }
# Phase 34. `project.toml`, with the same `serde` derive the scene format uses.
serde = { workspace = true }
toml = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

[[bin]]
name = "giochi-editor"
path = "src/main.rs"

# Phase 31. `New Scene` is a function, but the acceptance is a file that can be read
# back, so the example writes it, reloads it and prints what it found.
[[example]]
name = "editor_default_scene"
path = "examples/editor_default_scene.rs"

# Phase 34. Creates a project, imports real files, saves a scene through the editor's
# state and reloads everything — the acceptance without a window.
[[example]]
name = "editor_project_demo"
path = "examples/editor_project_demo.rs"
