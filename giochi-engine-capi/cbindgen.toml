# cbindgen configuration for `giochi.h`.
#
# The header is generated, never edited: `scripts/gen-header.sh` regenerates it and
# CI fails when the committed copy differs from a fresh run (see
# `docs/C_ABI.md`). The ABI itself is specified in `docs/C_ABI_CONTRACT.md`.
#
# `parse_deps` lets cbindgen resolve the `#[repr(C)]` value types that live in
# `giochi-engine` (`Vec2`, `Rect`, `Color`, `Sprite`, `Camera`, `Time`,
# `EngineConfig`), so the header declares their real layout instead of an opaque
# forward declaration. `export.rename` then gives each of them the `Giochi*` name the
# contract uses.

language = "C"
include_version = true
include_guard = "GIOCHI_H"
pragma_once = true
autogen_warning = "/* Generated by cbindgen from giochi-engine-capi. Do not edit. */"
braces = "SameLine"
line_length = 100
tab_width = 4
documentation = true
documentation_style = "c99"
documentation_length = "full"
usize_is_size_t = true

header = """/*
 * GIOCHI-ENGINE C ABI, version 1.
 *
 * Link against libgiochi.so (or libgiochi.a) and call giochi_engine_init() before
 * anything else. Every fallible function returns 0 on success and a negative code
 * on failure; giochi_get_last_error() then explains the failure.
 *
 * Resources are opaque u64 handles with explicit create/destroy; 0 is never valid.
 * Strings are NUL-terminated UTF-8 and are only read during the call, except the
 * ones returned by the library, which stay valid until the next call on the same
 * thread.
 *
 * The engine is single-threaded: call everything from the thread that called
 * giochi_engine_init(). giochi_get_last_error() is the only exception.
 */"""

[parse]
parse_deps = true
include = ["giochi-engine"]

[export]
prefix = ""

[export.rename]
"Vec2" = "GiochiVec2"
"Rect" = "GiochiRect"
"Color" = "GiochiColor"
"Sprite" = "GiochiSprite"
"Camera" = "GiochiCamera"
"Time" = "GiochiTime"
"TextureHandle" = "GiochiTexture"
"SoundHandle" = "GiochiSound"
"MusicHandle" = "GiochiMusic"
"SceneHandle" = "GiochiScene"
