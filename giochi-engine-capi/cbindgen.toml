# cbindgen configuration for `giochi.h`.
#
# The header is generated, never edited: `scripts/gen-header.sh` regenerates it and
# CI fails when the committed copy differs from a fresh run (see
# `docs/C_ABI.md`). The ABI itself is specified in `docs/C_ABI_CONTRACT.md`.
#
# `parse_deps` lets cbindgen resolve the `#[repr(C)]` value types that live in
# `giochi-engine` (`Vec2`, `Rect`, `Color`, `Sprite`, `Camera`, `Time`,
# `EngineConfig`), so the header declares their real layout instead of an opaque
# forward declaration. `export.rename` then gives each of them the `Giochi*` name the
# contract uses.

language = "C"
include_version = true
include_guard = "GIOCHI_H"
pragma_once = true
autogen_warning = "/* Generated by cbindgen from giochi-engine-capi. Do not edit. */"
braces = "SameLine"
line_length = 100
tab_width = 4
documentation = true
documentation_style = "c99"
documentation_length = "full"
usize_is_size_t = true

header = """/*
 * GIOCHI-ENGINE C ABI, version 2.
 *
 * Link against libgiochi.so (or libgiochi.a) and call giochi_engine_init() before
 * anything else. Every fallible function returns 0 on success and a negative code
 * on failure; giochi_get_last_error() then explains the failure.
 *
 * Resources are opaque u64 handles with explicit create/destroy; 0 is never valid.
 * Strings are NUL-terminated UTF-8 and are only read during the call, except the
 * ones returned by the library, which stay valid until the next call on the same
 * thread.
 *
 * The engine is single-threaded: call everything from the thread that called
 * giochi_engine_init(). giochi_get_last_error() is the only exception.
 *
 * Version 2 adds part II (3D) in docs/C_ABI_CONTRACT.md sections 8-12. Nothing in part I
 * changed, so a consumer written against version 1 keeps working; it should accept
 * giochi_abi_version() >= 1 rather than == 1.
 *
 * The 3D engine is an opaque pointer the caller owns (ADR-039), unlike the 2D singleton.
 * giochi_mesh_* and giochi_shader_* take no engine: they act on the most recently created
 * engine on the calling thread, and creating a second one is refused.
 */

/* Part II: the 3D engine has no C representation, so callers only ever see a pointer. */
typedef struct GiochiEngine3D GiochiEngine3D;"""

[parse]
parse_deps = true
include = ["giochi-engine", "giochi-engine-3d"]

[export]
prefix = ""
# `GiochiEngine3D` is declared by hand in the header above: it holds a `glow::Context`, a
# `Window` and a `Platform`, so emitting a struct body would be a lie that changes shape
# between releases (ADR-039).
exclude = ["GiochiEngine3D"]

[export.rename]
"Vec2" = "GiochiVec2"
"Rect" = "GiochiRect"
"Color" = "GiochiColor"
"Sprite" = "GiochiSprite"
"Camera" = "GiochiCamera"
"Time" = "GiochiTime"
"WindowConfig" = "GiochiWindowConfig"
"TextureHandle" = "GiochiTexture"
"SoundHandle" = "GiochiSound"
"MusicHandle" = "GiochiMusic"
"SceneHandle" = "GiochiScene"
# Part II (3D, `GIOCHI_ABI_VERSION 2`). `Vec3` is `GiochiVec3` and not `GiochiVec2`; the
# 2D `Vec2` keeps its own name, so a header including both is unambiguous.
"Vec3" = "GiochiVec3"
"Quat" = "GiochiQuat"
"Color3D" = "GiochiColor3D"
"Transform3D" = "GiochiTransform3D"
"Camera3D" = "GiochiCamera3D"
"DirectionalLight" = "GiochiDirectionalLight"
