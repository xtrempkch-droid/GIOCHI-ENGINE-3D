[package]
name = "giochi-net"
description = "Rede P2P host-autoritativa com Interest Management para o GIOCHI-ENGINE-3D"
version.workspace = true
edition.workspace = true
rust-version = "1.86"   # see the comment on the workspace value
license.workspace = true
authors.workspace = true
repository.workspace = true

# ## Zero dependência, de propósito
#
# O relatório do consultor exige compilar para `aarch64-unknown-linux-gnu` **sem
# dependência de sistema além do libc**, e propõe `mdns-sd` + `postcard`/`bincode`.
#
# A serialização ficou escrita à mão (`src/wire.rs`): o protocolo tem variantes
# de tipo fixo, e `serde` + derive custaria mais código gerado que a tabela
# inteira, além de esconder o offset do erro de leitura.
#
# O `mdns-sd` fica como decisão em aberto — ver `docs/REDE.md`. Ele puxa
# `if-addrs` e `socket2`, que são puro Rust mas fazem syscalls de descoberta de
# interface. Não é bloqueio de arquitetura; é coisa para medir compilando, e
# aqui **não há toolchain Rust** para medir.
[dependencies]
# Opcional, atrás da feature `laminar` (ver `src/laminar_backend.rs`).
#
# O laminar é a camada de rede do Amethyst: canais confiáveis-ordenados,
# sequenciados e fragmentação sobre UDP, **sem runtime assíncrono**. É o que
# falta ao transporte próprio, que não garante entrega nenhuma.
#
# Fica opcional para o alvo aarch64 poder continuar sem dependência alguma
# quando isso importar mais que a garantia de entrega.
laminar = { version = "0.5", optional = true }
# Descoberta de hosts na LAN (ver `src/descobrir.rs`).
#
# mDNS parece simples e nao e: sondagem para evitar colisao de nome, goodbye com
# TTL 0, e principalmente enviar para o grupo multicast NA INTERFACE certa --
# um send_to em 224.0.0.251 sem IP_MULTICAST_IF sai pela rota padrao e ninguem
# na LAN ve. A biblioteca resolve isso; escrever a mao custaria centenas de
# linhas de socket option e ficaria pior.
mdns-sd = { version = "0.13", optional = true }
# Enumerar interfaces, para o caso em que nao existe rota default. Ver `descobrir.rs`:
# o truque do `connect` UDP escolhe a interface certa quando ha rota default, e falha
# com ENETUNREACH quando nao ha -- que e o caso de um console ligado por USB-Ethernet
# ao PC, sem gateway. O `mdns-sd` ja puxa este crate, entao nao e dependencia nova no
# grafo; declarar aqui e o que permite chama-lo direto.
if-addrs = { version = "0.13", optional = true }

[dev-dependencies]

[[example]]
name = "loopback_smoke"
path = "examples/loopback_smoke.rs"

# Built only with `mdns`, which is what pulls `mdns-sd` in. Without this line cargo would
# try to compile it in a default build and fail on the missing crate.
[[example]]
name = "mdns_smoke"
path = "examples/mdns_smoke.rs"
required-features = ["mdns"]

[features]
default = []
# Transporte alternativo com garantias de entrega. Não muda o protocolo: os
# mesmos bytes de `wire` viajam por baixo.
laminar = ["dep:laminar"]
# Descoberta de hosts na LAN por mDNS. Puxa `if-addrs` e `socket2`, portanto NAO
# e compativel com o requisito de "zero dependencia" do alvo aarch64 -- fica
# desligada por padrao, e o CI cross-verifica esta feature a parte.
mdns = ["dep:mdns-sd", "dep:if-addrs"]
