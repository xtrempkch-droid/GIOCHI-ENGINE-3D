name: Cross Compile

# `ci.yml` only runs `cargo check` for ARM64, which never links. This workflow is the
# slower, fuller version: it provides ARM64 SDL2 libraries, links real binaries and
# inspects the ELF headers, so a change that only breaks the linker or the bundled CMake
# build of SDL2 is caught without waiting for a release tag.
#
# The multiarch recipe below was verified end to end in a clean ubuntu:24.04 container;
# see docs/CROSS_COMPILE.md.

on:
  push:
    branches: [main]
    paths:
      - "giochi-engine/**"
      - "giochi-engine-capi/**"
      - "giochi-engine-lua/**"
      - "giochi-demo/**"
      - "cmake/**"
      - "scripts/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cross-compile.yml"
  pull_request:
    paths:
      - "giochi-engine/**"
      - "giochi-engine-capi/**"
      - "giochi-engine-lua/**"
      - "giochi-demo/**"
      - "cmake/**"
      - "scripts/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cross-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: aarch64 cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and the ARM64 cross toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-check

      - name: Cross-check
        run: ./scripts/check-aarch64.sh

  link:
    name: aarch64 link
    # Pinned: the multiarch recipe is verified against this release's indexes, and
    # `ubuntu-latest` moving releases is exactly what broke it once.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-gnu

      - name: Install ARM64 SDL2 libraries
        # One script for both workflows: the multiarch recipe, pinned to the runner's
        # own release so the amd64 and arm64 indexes cannot disagree.
        run: sudo ./scripts/install-arm64-deps.sh

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-link

      - name: Cross-build and inspect the binaries
        # Builds and asserts the produced binaries are AArch64 ELF.
        run: ./scripts/build-aarch64.sh --workspace --all-targets
