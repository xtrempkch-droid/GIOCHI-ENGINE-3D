name: Cross Compile (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'giochi-engine/**'
      - 'giochi-engine-capi/**'
      - 'giochi-engine-lua/**'
      - 'giochi-demo/**'
      - 'Cross.toml'
      - '.github/workflows/cross-compile.yml'

jobs:
  build-aarch64:
    name: Build aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - uses: Swatinem/rust-cache@v2
      - name: Build ARM64
        run: cross build --workspace --release --target aarch64-unknown-linux-gnu
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: giochi-engine-aarch64
          path: target/aarch64-unknown-linux-gnu/release/giochi-demo
          if-no-files-found: warn
