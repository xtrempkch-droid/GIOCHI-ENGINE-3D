name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gates:
    name: Quality gates (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Install build dependencies
        # One script, not a copy-pasted apt list. SDL2's bundled CMake build needs the
        # X11 headers *and* the SDL2 satellites, and a list duplicated across four jobs
        # is how both went missing. See the header of the script.
        run: sudo ./scripts/install-deps.sh

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Build
        run: cargo build --workspace --target x86_64-unknown-linux-gnu

      - name: Test
        # Every integration test uses SDL's `dummy` driver, so no display is needed.
        run: cargo test --workspace --target x86_64-unknown-linux-gnu

      - name: Docs
        run: cargo doc --workspace --no-deps --document-private-items

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.27.0 --locked

      - name: C header is up to date
        # giochi.h is generated from the Rust crate; a stale copy would ship an ABI that
        # does not match the library.
        run: ./scripts/gen-header.sh --check

      - name: Version is consistent
        # Cargo.toml is the source of truth; docs, header, changelog and the path
        # dependency pins must agree with it or a release misreports what it is.
        run: ./scripts/check-version.sh

      - name: Lint the workflow files
        # Every job here runs shell that `shellcheck` never sees, and a YAML mistake
        # only surfaces as a red X after the push that was supposed to prove the
        # change works. Pinned so the linter cannot change behaviour under us.
        run: |
          set -euo pipefail
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

      - name: Asset BMP twins are up to date
        # A target whose SDL2_image has no PNG decoder loads the .bmp twin instead
        # (ADR-036), so a stale twin is a bug that only shows up on that target.
        run: python3 scripts/png-to-bmp.py --check assets/player.png assets/checker.png

      - name: Shell scripts lint
        # Every workflow calls these instead of reimplementing them, so a broken
        # script fails all jobs at once.
        run: shellcheck scripts/*.sh

  ffi:
    name: C and Python consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install build dependencies
        run: sudo ./scripts/install-deps.sh

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.27.0 --locked

      - uses: Swatinem/rust-cache@v2

      - name: Build libgiochi and run the C and Python smoke tests
        # Compiles c_smoke.c with -Wall -Wextra -Werror against the generated header,
        # runs it, then runs python_smoke.py (ctypes, standard library only).
        run: ./scripts/ffi-smoke.sh

  cross-check:
    name: Cross-check (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust and the ARM64 cross toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-check

      - name: cargo check --target aarch64-unknown-linux-gnu
        run: ./scripts/check-aarch64.sh

  smoke:
    name: Demo, examples and the Lua game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install build dependencies
        run: sudo ./scripts/install-deps.sh

      - uses: Swatinem/rust-cache@v2

      - name: Demo pipeline check
        # `--verify` runs one frame through the whole `Engine` and reports the live
        # texture/sound counts, catching link or init regressions that `cargo test` can
        # miss because the test binaries do not build the cdylib.
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          cargo run -q -p giochi-demo -- --verify
          cargo run -q -p giochi-demo -- --frames 60

      - name: Examples
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          cargo run -q -p giochi-engine --example hello_rect -- --frames 30
          cargo run -q -p giochi-engine --example moving_sprite -- --frames 30
          cargo run -q -p giochi-engine --example input_test -- --frames 30
          cargo run -q -p giochi-engine --example audio_test -- --frames 10
          cargo run -q -p giochi-engine --example mini_game -- --auto --frames 120

      - name: Lua reference game
        # The binding's own end-to-end check: a real script, the real engine, no keyboard.
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          cargo run -q -p giochi-demo -- lua giochi-engine-lua/examples/mini_game.lua \
            --auto --frames 120

      - name: 3D context and mesh pipeline
        # `SDL_VIDEODRIVER=dummy` has no OpenGL at all; `offscreen` provides a real
        # EGL/GLES context with no display attached. Measured on a developer machine:
        # dummy fails with "OpenGL support is either not configured in SDL", offscreen
        # gets the full driver stack. The integration tests skip cleanly when a runner
        # has no GL, so this step cannot produce a false failure.
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          cargo test -q -p giochi-engine-3d --test context_smoke
          cargo test -q -p giochi-engine-3d --test mesh_pipeline
          cargo run -q -p giochi-engine-3d --example cube_demo -- --frames 60

      - name: 3D lighting
        # Reads the framebuffer back and asserts the *shading*, not the call sequence:
        # a sphere is brighter above its centre under a downward light, that relationship
        # inverts when the light does, the specular term raises the peak, a red light
        # zeroes green and blue, and a cube saturates under a downward light while going
        # black under an upward one. A missing negation in the fragment shader or a
        # `vec3` uniform filled as a `vec4` renders a plausible-looking frame, so no
        # assertion short of reading the pixels catches either.
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          cargo test -q -p giochi-engine-3d --test lighting
          cargo run -q -p giochi-engine-3d --example mini_fps -- --frames 60 --auto \
            | tee /tmp/mini_fps_lit.log
          grep -q 'light direction' /tmp/mini_fps_lit.log
          grep -q 'no GL error' /tmp/mini_fps_lit.log

      - name: 3D without vertex array objects
        # GLES 2.0 devices without `GL_OES_vertex_array_object` take the per-draw
        # attribute path, and no developer machine has that driver. This is the only
        # way that fallback is ever exercised before it reaches a console.
        env:
          SDL_VIDEODRIVER: offscreen
          GIOCHI_FORCE_NO_VAO: "1"
        run: |
          cargo test -q -p giochi-engine-3d --test mesh_pipeline
          cargo run -q -p giochi-engine-3d --example cube_demo -- --frames 30

      - name: 3D first-person walker
        # `--auto` walks a scripted path: `Input`'s keyboard state is only populated by
        # real SDL events, so an unattended run has to drive the axes directly. Without
        # this the movement code is never executed on a keyboard-less runner.
        env:
          SDL_VIDEODRIVER: offscreen
        run: cargo run -q -p giochi-engine-3d --example mini_fps -- --frames 120 --auto

      - name: 3D balance game
        # The ball has to finish where the script pushed it. This is the program-level
        # twin of the unit tests in `game::balance`: those prove the physics responds in
        # the right direction, this proves the example actually feeds input into it and
        # draws the result.
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          cargo run -q -p giochi-engine-3d --example ball_balance -- \
            --frames 200 --auto | tee /tmp/balance.log
          python3 - <<'PY'
          import re
          log = open("/tmp/balance.log").read()
          match = re.search(r"bola em \(([+-][\d.]+),([+-][\d.]+)\)", log)
          assert match, f"no final ball position in the log:\n{log}"
          x, z = float(match.group(1)), float(match.group(2))
          assert x > 0.5, f"the script starts by pushing right; the ball ended at x={x}"
          assert z > 0.5, f"the script ends by pushing near; the ball ended at z={z}"
          assert "no GL error" in log, log
          PY

      - name: 3D balance game capture
        # "It ran" is weaker than "it drew a ball on a platform". The ball is the only pale
        # region and the platform the only large grey one, so both are looked for by colour.
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          cargo run -q -p giochi-engine-3d --example ball_balance -- \
            --frames 200 --auto --quadro /tmp/balance.bmp
          test -s /tmp/balance.bmp
          python3 - <<'PY'
          import struct
          data = open("/tmp/balance.bmp", "rb").read()
          assert data[:2] == b"BM", "not a BMP"
          offset = struct.unpack("<I", data[10:14])[0]
          width, height = struct.unpack("<ii", data[18:26])
          assert (width, height) == (1280, 720), f"{width}x{height}"

          pale = grey = blue = green = 0
          for i in range(offset, len(data), 4):
              b, g, r = data[i], data[i + 1], data[i + 2]
              if r > 190 and g > 180 and b > 120:
                  pale += 1
              elif 55 < r < 90 and 62 < g < 100 and 78 < b < 120:
                  grey += 1
              elif r < 140 and g > 140 and b > 190:
                  blue += 1
              elif r < 110 and g > 150 and b < 140:
                  green += 1

          assert pale > 2000, f"no ball in the frame ({pale} pale pixels)"
          assert grey > 40000, f"no platform in the frame ({grey} grey pixels)"
          # The two indicators are the reason the game exists: the blue cube is the raw
          # input, the green one is the hitch lamp. Neither is an error if it is off
          # screen, which is how they once shipped invisible on the console's 4:3 panel --
          # `BalanceView`'s tests check the 4:3 case, and this checks that the example
          # actually draws what they place.
          assert blue > 500, f"the raw-input marker is not in the frame ({blue} blue px)"
          assert green > 500, f"the hitch indicator is not in the frame ({green} green px)"
          print(f"ball {pale} px, platform {grey} px, input marker {blue} px, hitch {green} px")
          PY

      - name: 3D frame capture
        # "It drew a frame" and "it drew the right frame" are different claims. The
        # capture is a real BMP read back with glReadPixels, and the size is asserted so
        # an all-black 0x0 image cannot pass.
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          cargo run -q -p giochi-engine-3d --example cube_demo -- \
            --frames 3 --quadro /tmp/cube-3d.bmp
          test -s /tmp/cube-3d.bmp
          python3 - <<'PY'
          import struct
          data = open("/tmp/cube-3d.bmp", "rb").read()
          assert data[:2] == b"BM", "not a BMP"
          width, height = struct.unpack("<ii", data[18:26])
          assert width > 0 and height > 0, f"empty capture: {width}x{height}"
          print(f"captured {width}x{height}, {len(data)} bytes")
          PY

      - name: 3D opt-in GLES 3.0 path
        # The fallback is the interesting part: the driver may answer 2.0 and the code
        # must continue rather than fail.
        env:
          SDL_VIDEODRIVER: offscreen
          GIOCHI_GL_VERSION: "3"
        run: cargo run -q -p giochi-engine-3d --example cube_demo -- --frames 30
