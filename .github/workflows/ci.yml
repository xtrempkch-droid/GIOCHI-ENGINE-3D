name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gates:
    name: Quality gates (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        # O SDL2 "bundled" e compilado do codigo-fonte quando o cache do cargo nao
        # existe -- e qualquer mudanca em `Cargo.lock` invalida a chave. Sem
        # liberar espaco, o build script do `sdl2-sys` falha ao copiar
        # `libSDL2_test.a` com um erro de I/O que ele NAO imprime, e o sintoma e
        # "failed to run custom build command for sdl2-sys", que parece bug de
        # codigo e nao e.
        #
        # Medido: a execucao com cache passou; a sem cache falhou no mesmo
        # commit base. Os ~20 GB removidos aqui sao SDKs pre-instalados no runner
        # que este projeto nao usa.
        run: |
          echo "antes:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          echo "depois:"; df -h /

      - name: Create cargo deps directories
        # One script, because the same three lines were needed in every job that
        # builds and were present in only this one -- which is why the release
        # workflow died on this and not the pull-request one. See the header of the
        # script for the reproduction.
        run: ./scripts/create-cargo-deps-dirs.sh

      - name: Install Rust
        run: |
          rustup show
          rustc --version

      - name: Install build dependencies
        # One script, not a copy-pasted apt list. SDL2's bundled CMake build needs the
        # X11 headers *and* the SDL2 satellites, and a list duplicated across four jobs
        # is how both went missing. See the header of the script.
        run: sudo ./scripts/install-deps.sh

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Clippy with networking optional features
        # The workspace build does not enable `laminar`/`mdns`; without this their code
        # is only compiled by the aarch64 check, which never runs clippy.
        run: cargo clippy -p giochi-net --all-targets --all-features --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Build
        run: cargo build --workspace --target x86_64-unknown-linux-gnu

      - name: Test
        # Every integration test uses SDL's `dummy` driver, so no display is needed.
        run: cargo test --workspace --target x86_64-unknown-linux-gnu

      - name: Test with the profiling feature
        # The default build compiles the profiler and every counter out, so a test that
        # asserts the counting behaviour has to be given a build where counting exists.
        # Without this step the feature is only compiled by the perf workflow, which runs
        # one test binary.
        run: |
          cargo test -p giochi-engine --features profiling --target x86_64-unknown-linux-gnu
          cargo test -p giochi-engine-3d --features profiling --target x86_64-unknown-linux-gnu

      - name: Test with the networking optional features
        # `laminar` and `mdns` are off by default, so the workspace test step never
        # reaches them. Their tests use loopback/multicast and are cheap.
        run: cargo test -p giochi-net --all-features --target x86_64-unknown-linux-gnu

      - name: Test with the Growth Pack features
        # Phases 19-24 are opt-in, and a test declared `required-features` is *skipped*
        # by the default step above rather than failing: without this, `hot_reload`,
        # `devtools`, the physics modules and the 3D HUD would be type-checked and never
        # run. `--all-features` is deliberately not used at workspace level -- it enables
        # `sdl2-bundled` and `sdl2-system` together, and `sdl2-sys` then links a mixture
        # that has no SDL_mixer/SDL_image symbols (see scripts/check-features.sh).
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          cargo test --workspace --target x86_64-unknown-linux-gnu \
            --features giochi-engine/hot_reload,giochi-engine-3d/hot_reload,giochi-engine-lua/hot_reload,giochi-demo/hot_reload,giochi-engine/devtools,giochi-engine/physics-2d,giochi-engine-3d/physics-3d,giochi-engine-3d/hud
          cargo clippy --workspace --all-targets --target x86_64-unknown-linux-gnu \
            --features giochi-engine/hot_reload,giochi-engine-3d/hot_reload,giochi-engine-lua/hot_reload,giochi-demo/hot_reload,giochi-engine/devtools,giochi-engine/physics-2d,giochi-engine-3d/physics-3d,giochi-engine-3d/hud \
            -- -D warnings

      - name: Docs
        run: cargo doc --workspace --no-deps --document-private-items

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.27.0 --locked

      - name: C header is up to date
        # giochi.h is generated from the Rust crate; a stale copy would ship an ABI that
        # does not match the library.
        run: ./scripts/gen-header.sh --check

      - name: Version is consistent
        # Cargo.toml is the source of truth; docs, header, changelog and the path
        # dependency pins must agree with it or a release misreports what it is.
        run: ./scripts/check-version.sh

      - name: SDL2 feature forwarding
        # A manifest can look correct and still resolve `sdl2-system` to a bundled
        # CMake build, because cargo unions features across the graph. Only the
        # resolution shows it, so this inspects `cargo tree`.
        run: ./scripts/check-features.sh

      - name: Build against the system SDL2
        # The one path the default build never takes: `sdl2-system` is what the console
        # image and the cross-compile use, and until now nothing compiled it. If a
        # feature ever leaks `bundled` back in, this is where it surfaces as a CMake
        # build instead of a pkg-config link.
        run: |
          cargo build -p giochi-engine-capi --target x86_64-unknown-linux-gnu \
            --no-default-features --features sdl2-system

      - name: Lint the workflow files
        # Every job here runs shell that `shellcheck` never sees, and a YAML mistake
        # only surfaces as a red X after the push that was supposed to prove the
        # change works. Pinned so the linter cannot change behaviour under us.
        run: |
          set -euo pipefail
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

      - name: Asset BMP twins are up to date
        # A target whose SDL2_image has no PNG decoder loads the .bmp twin instead
        # (ADR-036), so a stale twin is a bug that only shows up on that target.
        run: python3 scripts/png-to-bmp.py --check assets/player.png assets/checker.png

      - name: Shell scripts lint
        # Every workflow calls these instead of reimplementing them, so a broken
        # script fails all jobs at once.
        run: shellcheck scripts/*.sh

  ffi:
    name: C and Python consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        # O SDL2 "bundled" e compilado do codigo-fonte quando o cache do cargo nao
        # existe -- e qualquer mudanca em `Cargo.lock` invalida a chave. Sem
        # liberar espaco, o build script do `sdl2-sys` falha ao copiar
        # `libSDL2_test.a` com um erro de I/O que ele NAO imprime, e o sintoma e
        # "failed to run custom build command for sdl2-sys", que parece bug de
        # codigo e nao e.
        #
        # Medido: a execucao com cache passou; a sem cache falhou no mesmo
        # commit base. Os ~20 GB removidos aqui sao SDKs pre-instalados no runner
        # que este projeto nao usa.
        run: |
          echo "antes:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          echo "depois:"; df -h /

      - name: Create cargo deps directories
        # One script, because the same three lines were needed in every job that
        # builds and were present in only two of them -- which is why the release
        # workflow died on this and the pull-request ones did not. See the header of
        # the script for the reproduction.
        run: ./scripts/create-cargo-deps-dirs.sh

      - name: Install Rust
        run: |
          rustup show

      - name: Install build dependencies
        run: sudo ./scripts/install-deps.sh

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.27.0 --locked

      - uses: Swatinem/rust-cache@v2

      - name: Build libgiochi and run the C and Python smoke tests
        # Compiles c_smoke.c and c_smoke_3d.c with -Wall -Wextra -Werror against the
        # generated header, runs both, then runs python_smoke.py and python_smoke_3d.py
        # (ctypes, standard library only). The two 3D consumers need a real GL driver, so
        # the script runs them under SDL_VIDEODRIVER=offscreen and treats exit 77 as
        # "this runner has no Mesa" rather than a failure.
        run: ./scripts/ffi-smoke.sh

  cross-check:
    name: Cross-check (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        # O SDL2 "bundled" e compilado do codigo-fonte quando o cache do cargo nao
        # existe -- e qualquer mudanca em `Cargo.lock` invalida a chave. Sem
        # liberar espaco, o build script do `sdl2-sys` falha ao copiar
        # `libSDL2_test.a` com um erro de I/O que ele NAO imprime, e o sintoma e
        # "failed to run custom build command for sdl2-sys", que parece bug de
        # codigo e nao e.
        #
        # Medido: a execucao com cache passou; a sem cache falhou no mesmo
        # commit base. Os ~20 GB removidos aqui sao SDKs pre-instalados no runner
        # que este projeto nao usa.
        run: |
          echo "antes:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          echo "depois:"; df -h /

      - name: Create cargo deps directories
        # One script, because the same three lines were needed in every job that
        # builds and were present in only two of them -- which is why the release
        # workflow died on this and the pull-request ones did not. See the header of
        # the script for the reproduction.
        run: ./scripts/create-cargo-deps-dirs.sh

      - name: Install Rust and the ARM64 cross toolchain
        run: |
          rustup show
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-check

      - name: cargo check --target aarch64-unknown-linux-gnu
        run: ./scripts/check-aarch64.sh

  smoke:
    name: Demo, examples and the Lua game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        # O SDL2 "bundled" e compilado do codigo-fonte quando o cache do cargo nao
        # existe -- e qualquer mudanca em `Cargo.lock` invalida a chave. Sem
        # liberar espaco, o build script do `sdl2-sys` falha ao copiar
        # `libSDL2_test.a` com um erro de I/O que ele NAO imprime, e o sintoma e
        # "failed to run custom build command for sdl2-sys", que parece bug de
        # codigo e nao e.
        #
        # Medido: a execucao com cache passou; a sem cache falhou no mesmo
        # commit base. Os ~20 GB removidos aqui sao SDKs pre-instalados no runner
        # que este projeto nao usa.
        run: |
          echo "antes:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          echo "depois:"; df -h /

      - name: Create cargo deps directories
        # One script, because the same three lines were needed in every job that
        # builds and were present in only two of them -- which is why the release
        # workflow died on this and the pull-request ones did not. See the header of
        # the script for the reproduction.
        run: ./scripts/create-cargo-deps-dirs.sh

      - name: Install Rust
        run: |
          rustup show

      - name: Install build dependencies
        run: sudo ./scripts/install-deps.sh

      - uses: Swatinem/rust-cache@v2

      - name: Demo pipeline check
        # `--verify` runs one frame through the whole `Engine` and reports the live
        # texture/sound counts, catching link or init regressions that `cargo test` can
        # miss because the test binaries do not build the cdylib.
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          cargo run -q -p giochi-demo -- --verify
          cargo run -q -p giochi-demo -- --frames 60

      - name: Editor boot
        # Salto B phase 30. The editor owns its own loop instead of the engine's, and it
        # paints with `sdl2::render` rather than GLES, so `dummy` plus the software
        # renderer is enough: a missing panel, a panic in the layout or a broken egui
        # backend all fail here. `--frames` is what makes a loop that otherwise waits for
        # the window to close terminate.
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
        run: |
          # Phase 38: settings and autosaves go to a scratch folder, so a CI run cannot
          # leave a recent list behind for the next job (or for a developer's `act` run).
          cargo run -q -p giochi-editor -- --frames 30 --config /tmp/giochi-ci-config
          # The default scene is written, reloaded and compared by the example; the
          # editor then opens it, so the loader, the viewport projection and the window
          # title all run in CI.
          cargo run -q -p giochi-editor --example editor_default_scene | tee /tmp/scene.log
          grep -q 'roundtrip=ok' /tmp/scene.log
          cargo run -q -p giochi-editor -- --scene giochi-editor/assets/scenes/default.scene --frames 30
          # Phase 34: create a project, import real files, save a scene through the
          # editor's state and reload it; then open that project and scene for real.
          rm -rf /tmp/giochi-ci-project
          cargo run -q -p giochi-editor --example editor_project_demo -- /tmp/giochi-ci-project \
            | tee /tmp/project.log
          grep -q 'project=ok' /tmp/project.log
          cargo run -q -p giochi-editor -- --project /tmp/giochi-ci-project \
            --scene /tmp/giochi-ci-project/scenes/demo.scene --frames 30

      - name: Editor play preview (GL)
        # Phase 39. The preview opens an OpenGL window, which `dummy` cannot provide: this
        # step needs `offscreen` (a real EGL context with no display) exactly like the
        # engine's own 3D render tests. The test skips itself when the runner has no Mesa,
        # and prints why.
        env:
          SDL_VIDEODRIVER: offscreen
        run: cargo test -q -p giochi-editor --test play_render

      - name: Editor package
        # Phase 40, and rule 11 of the plan: the build is part of the deliverable. The
        # script builds release, lays the folder out and hashes it; the verifier then runs
        # the packaged binary from *inside* the package, which is the only way to catch a
        # binary that was finding its assets in the checkout.
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
        run: |
          scripts/package-editor.sh
          scripts/verify-editor-package.sh

      - name: Production Pack modules
        # Phase 26.6/26.7. The catalogue check is the one that only exists here: it compares
        # the shipped translations against each other, and a missing key is a silent English
        # sentence in the Portuguese menu at runtime.
        run: |
          cargo run -q -p giochi-engine --example i18n_demo | tee /tmp/i18n.log
          grep -q 'i18n=ok' /tmp/i18n.log

      - name: glTF viewer (GL)
        # Needs a real EGL context (`dummy` has no OpenGL). The viewer loads a model from
        # disk, uploads one mesh per primitive and draws each with its own material, which is
        # the whole glTF path. The model is committed (`assets/models/car.gltf` plus its
        # `.bin`), so the step also proves a model resolves its buffer next to itself.
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          cargo run -q -p giochi-engine-3d --example gltf_viewer -- \
            assets/models/car.gltf --frames 3

      - name: Examples
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          cargo run -q -p giochi-engine --example hello_rect -- --frames 30
          cargo run -q -p giochi-engine --example moving_sprite -- --frames 30
          cargo run -q -p giochi-engine --example input_test -- --frames 30
          cargo run -q -p giochi-engine --example audio_test -- --frames 10
          cargo run -q -p giochi-engine --example mini_game -- --auto --frames 120

      - name: Lua reference game
        # The binding's own end-to-end check: a real script, the real engine, no keyboard.
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          cargo run -q -p giochi-demo -- lua giochi-engine-lua/examples/mini_game.lua \
            --auto --frames 120

      - name: Growth Pack examples
        # Phases 19-24 each ship an example, and a `required-features` example is not even
        # built by the default test step. Without this, `particles_2d_demo` could stop
        # compiling, `platformer_2d` could stop reaching its goal, and nothing would say so.
        # `model_viewer` is absent on purpose: it needs a path to an OBJ file and exits with
        # an error without one, which is its documented behaviour, not a failure.
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          cargo run -q -p giochi-engine --example particles_2d_demo -- --frames 120 --auto
          cargo run -q -p giochi-engine --example animation_demo -- --frames 120 --auto
          cargo run -q -p giochi-engine --features physics-2d --example physics_2d_demo \
            -- --frames 300 --auto
          # The platformer is the phase-24 acceptance check for "gravity and a jump": the
          # scripted run either reaches the last platform or it does not.
          cargo run -q -p giochi-engine --features physics-2d --example platformer_2d \
            -- --frames 1800 --auto | tee /tmp/platformer.log
          grep -q 'alvo_alcancado=true' /tmp/platformer.log
          cargo run -q -p giochi-engine --features devtools --example devtools_demo -- --frames 120
          cargo run -q -p giochi-engine --features devtools --example ui_demo -- --frames 120
          cargo run -q -p giochi-engine --features hot_reload --example hot_reload_demo \
            -- --frames 120
          # The 3D side needs a real EGL context, so it uses `offscreen` in its own step
          # below; here only the 2D renderer is exercised.

      - name: Growth Pack in 3D
        # `--physics` and `--hud` are the phase-24 and phase-21 pendencies: the walker has to
        # stay inside the world and the HUD has to draw without a GL error.
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          cargo run -q -p giochi-engine-3d --features physics-3d --example physics_3d_demo \
            -- --frames 420 --auto | tee /tmp/physics3d.log
          grep -q 'bloqueado_pela_parede=true' /tmp/physics3d.log
          grep -q 'apoiado_no_chao=true' /tmp/physics3d.log
          cargo run -q -p giochi-engine-3d --features physics-3d,hud --example mini_fps \
            -- --frames 200 --auto --physics --hud | tee /tmp/mini_fps_physics.log
          grep -q 'hud:' /tmp/mini_fps_physics.log
          grep -q 'no GL error' /tmp/mini_fps_physics.log

      - name: 3D context and mesh pipeline
        # `SDL_VIDEODRIVER=dummy` has no OpenGL at all; `offscreen` provides a real
        # EGL/GLES context with no display attached. Measured on a developer machine:
        # dummy fails with "OpenGL support is either not configured in SDL", offscreen
        # gets the full driver stack. The integration tests skip cleanly when a runner
        # has no GL, so this step cannot produce a false failure.
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          cargo test -q -p giochi-engine-3d --test context_smoke
          cargo test -q -p giochi-engine-3d --test mesh_pipeline
          cargo run -q -p giochi-engine-3d --example cube_demo -- --frames 60

      - name: 3D lighting
        # Reads the framebuffer back and asserts the *shading*, not the call sequence:
        # a sphere is brighter above its centre under a downward light, that relationship
        # inverts when the light does, the specular term raises the peak, a red light
        # zeroes green and blue, and a cube saturates under a downward light while going
        # black under an upward one. A missing negation in the fragment shader or a
        # `vec3` uniform filled as a `vec4` renders a plausible-looking frame, so no
        # assertion short of reading the pixels catches either.
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          cargo test -q -p giochi-engine-3d --test lighting
          cargo run -q -p giochi-engine-3d --example mini_fps -- --frames 60 --auto \
            | tee /tmp/mini_fps_lit.log
          grep -q 'light direction' /tmp/mini_fps_lit.log
          grep -q 'no GL error' /tmp/mini_fps_lit.log
          # `mini_fps` must draw a crate it can look down on, or "the top face is brighter
          # than the side" describes geometry the player never sees. The obstacles are 2 m
          # and the eye is at 1.7 m, so their tops are always above the camera; the low
          # crates are the ones that put a top face in view.
          python3 - <<'PY'
          import re
          log = open("/tmp/mini_fps_lit.log").read()
          match = re.search(r"(\d+) low crates on the last frame", log)
          assert match, f"mini_fps did not report a crate count:\n{log}"
          crates = int(match.group(1))
          assert crates > 0, f"no low crates drawn; the top face is never in view ({crates})"
          print(f"{crates} low crates, each with a visible top face")
          PY

      - name: 3D without vertex array objects
        # GLES 2.0 devices without `GL_OES_vertex_array_object` take the per-draw
        # attribute path, and no developer machine has that driver. This is the only
        # way that fallback is ever exercised before it reaches a console.
        env:
          SDL_VIDEODRIVER: offscreen
          GIOCHI_FORCE_NO_VAO: "1"
        run: |
          cargo test -q -p giochi-engine-3d --test mesh_pipeline
          cargo run -q -p giochi-engine-3d --example cube_demo -- --frames 30

      - name: 3D instancing, upscaling and static batches
        # The upscale tests used to live outside every workflow, and the tests in a file
        # used to skip after the first one because only one test may own SDL's
        # `EventPump`; the helpers now serialise instead of interpreting that as
        # "no GL driver". Both are why this step exists.
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          cargo test -q -p giochi-engine-3d --test instancing
          cargo test -q -p giochi-engine-3d --test upscale
          cargo test -q -p giochi-engine-3d --test static_batch

      - name: 3D without instanced drawing
        # Drivers that expose none of GLES 3.0 core, ANGLE or EXT take the per-instance
        # path. It has to draw the same picture as one call, not merely report the same
        # call count, so the forced run compares the frames.
        env:
          SDL_VIDEODRIVER: offscreen
          GIOCHI_FORCE_NO_INSTANCING: "1"
        run: |
          cargo test -q -p giochi-engine-3d --test instancing
          cargo run -q -p giochi-engine-3d --example mini_fps -- --frames 30 --loop

      - name: 3D first-person walker
        # `--auto` walks a scripted path: `Input`'s keyboard state is only populated by
        # real SDL events, so an unattended run has to drive the axes directly. Without
        # this the movement code is never executed on a keyboard-less runner.
        env:
          SDL_VIDEODRIVER: offscreen
        run: cargo run -q -p giochi-engine-3d --example mini_fps -- --frames 120 --auto

      - name: 3D balance game
        # The ball has to finish where the script pushed it. This is the program-level
        # twin of the unit tests in `game::balance`: those prove the physics responds in
        # the right direction, this proves the example actually feeds input into it and
        # draws the result.
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          cargo run -q -p giochi-engine-3d --example ball_balance -- \
            --frames 200 --auto | tee /tmp/balance.log
          python3 - <<'PY'
          import re
          log = open("/tmp/balance.log").read()
          match = re.search(r"bola em \(([+-][\d.]+),([+-][\d.]+)\)", log)
          assert match, f"no final ball position in the log:\n{log}"
          x, z = float(match.group(1)), float(match.group(2))
          assert x > 0.5, f"the script starts by pushing right; the ball ended at x={x}"
          assert z > 0.5, f"the script ends by pushing near; the ball ended at z={z}"
          assert "no GL error" in log, log
          PY

      - name: 3D balance game capture
        # "It ran" is weaker than "it drew a ball on a platform". The ball is the only pale
        # region and the platform the only large grey one, so both are looked for by colour.
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          cargo run -q -p giochi-engine-3d --example ball_balance -- \
            --frames 200 --auto --quadro /tmp/balance.bmp
          test -s /tmp/balance.bmp
          python3 - <<'PY'
          import struct
          data = open("/tmp/balance.bmp", "rb").read()
          assert data[:2] == b"BM", "not a BMP"
          offset = struct.unpack("<I", data[10:14])[0]
          width, height = struct.unpack("<ii", data[18:26])
          assert (width, height) == (1280, 720), f"{width}x{height}"

          pale = grey = blue = green = 0
          for i in range(offset, len(data), 4):
              b, g, r = data[i], data[i + 1], data[i + 2]
              if r > 190 and g > 180 and b > 120:
                  pale += 1
              elif 55 < r < 90 and 62 < g < 100 and 78 < b < 120:
                  grey += 1
              elif r < 140 and g > 140 and b > 190:
                  blue += 1
              elif r < 110 and g > 150 and b < 140:
                  green += 1

          assert pale > 2000, f"no ball in the frame ({pale} pale pixels)"
          assert grey > 40000, f"no platform in the frame ({grey} grey pixels)"
          # The two indicators are the reason the game exists: the blue cube is the raw
          # input, the green one is the hitch lamp. Neither is an error if it is off
          # screen, which is how they once shipped invisible on the console's 4:3 panel --
          # `BalanceView`'s tests check the 4:3 case, and this checks that the example
          # actually draws what they place.
          assert blue > 500, f"the raw-input marker is not in the frame ({blue} blue px)"
          assert green > 500, f"the hitch indicator is not in the frame ({green} green px)"
          print(f"ball {pale} px, platform {grey} px, input marker {blue} px, hitch {green} px")
          PY

      - name: 3D frame capture
        # "It drew a frame" and "it drew the right frame" are different claims. The
        # capture is a real BMP read back with glReadPixels, and the size is asserted so
        # an all-black 0x0 image cannot pass.
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          cargo run -q -p giochi-engine-3d --example cube_demo -- \
            --frames 3 --quadro /tmp/cube-3d.bmp
          test -s /tmp/cube-3d.bmp
          python3 - <<'PY'
          import struct
          data = open("/tmp/cube-3d.bmp", "rb").read()
          assert data[:2] == b"BM", "not a BMP"
          width, height = struct.unpack("<ii", data[18:26])
          assert width > 0 and height > 0, f"empty capture: {width}x{height}"
          print(f"captured {width}x{height}, {len(data)} bytes")
          PY

      - name: 3D opt-in GLES 3.0 path
        # The fallback is the interesting part: the driver may answer 2.0 and the code
        # must continue rather than fail.
        env:
          SDL_VIDEODRIVER: offscreen
          GIOCHI_GL_VERSION: "3"
        run: cargo run -q -p giochi-engine-3d --example cube_demo -- --frames 30
