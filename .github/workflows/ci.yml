name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gates:
    name: Quality gates (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Install SDL2 build dependencies
        # SDL2 itself is built from source by the `bundled` feature; these are its
        # optional backends.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang libclang-dev \
            libasound2-dev libudev-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --target x86_64-unknown-linux-gnu

      - name: Test
        # Every integration test uses SDL's `dummy` driver, so no display is needed.
        run: cargo test --workspace --target x86_64-unknown-linux-gnu

      - name: Docs
        run: cargo doc --workspace --no-deps --document-private-items

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.27.0 --locked

      - name: C header is up to date
        # giochi.h is generated from the Rust crate; a stale copy would ship an ABI
        # that does not match the library.
        run: ./scripts/gen-header.sh --check

  ffi:
    name: C and Python consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install SDL2 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang libclang-dev \
            libasound2-dev libudev-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.27.0 --locked

      - uses: Swatinem/rust-cache@v2

      - name: Build libgiochi and run the C and Python smoke tests
        # Compiles giochi-engine-capi/tests/c_smoke.c with -Wall -Wextra -Werror
        # against the generated header, runs it, then runs python_smoke.py.
        run: ./scripts/ffi-smoke.sh

  cross-check:
    name: Cross-check (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and the ARM64 cross toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version

      - uses: Swatinem/rust-cache@v2

      - name: cargo check --target aarch64-unknown-linux-gnu
        run: scripts/check-aarch64.sh

  smoke:
    name: Demo and examples smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install SDL2 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang libclang-dev \
            libasound2-dev libudev-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      - name: Demo pipeline check
        # `--verify` runs one frame through the whole `Engine` and reports the live
        # texture/sound counts, catching link or init regressions that `cargo test`
        # can miss.
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          cargo run -p giochi-demo -- --verify
          cargo run -p giochi-demo -- --frames 60

      - name: Examples
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          cargo run -p giochi-engine --example hello_rect -- --frames 30
          cargo run -p giochi-engine --example moving_sprite -- --frames 30
          cargo run -p giochi-engine --example input_test -- --frames 30
          cargo run -p giochi-engine --example audio_test -- --frames 10
          cargo run -p giochi-engine --example mini_game -- --auto --frames 120
