        # `deps/` e ASSUME que o diretorio existe. Num target dir frio -- que e o
        # que acontece quando qualquer mudanca em `Cargo.lock` invalida o cache --
        # ele ainda nao existe, e o `fs::copy` falha com um errno que o script
        # descarta: a mensagem sai so como "Failed to copy SDL2 dynamic library",
        # que parece bug de codigo e nao e.
        #
        # Medido: a execucao com cache passou; as sem cache falharam no mesmo
        # commit base, e o destino que aparece no panic e o de `deps/` (a copia
        # para o diretorio pai tinha acabado de dar certo).
        run: |
          mkdir -p target/debug/deps target/release/deps
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            mkdir -p "target/$triple/debug/deps" "target/$triple/release/deps"
          done

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install build dependencies
        run: sudo ./scripts/install-deps.sh

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.27.0 --locked

      - uses: Swatinem/rust-cache@v2

      - name: Build libgiochi and run the C and Python smoke tests
        # Compiles c_smoke.c and c_smoke_3d.c with -Wall -Wextra -Werror against the
        # generated header, runs both, then runs python_smoke.py and python_smoke_3d.py
        # (ctypes, standard library only). The two 3D consumers need a real GL driver, so
        # the script runs them under SDL_VIDEODRIVER=offscreen and treats exit 77 as
        # "this runner has no Mesa" rather than a failure.
        run: ./scripts/ffi-smoke.sh

  cross-check:
    name: Cross-check (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        # O SDL2 "bundled" e compilado do codigo-fonte quando o cache do cargo nao
        # existe -- e qualquer mudanca em `Cargo.lock` invalida a chave. Sem
        # liberar espaco, o build script do `sdl2-sys` falha ao copiar
        # `libSDL2_test.a` com um erro de I/O que ele NAO imprime, e o sintoma e
        # "failed to run custom build command for sdl2-sys", que parece bug de
        # codigo e nao e.
        #
        # Medido: a execucao com cache passou; a sem cache falhou no mesmo
        # commit base. Os ~20 GB removidos aqui sao SDKs pre-instalados no runner
        # que este projeto nao usa.
        run: |
          echo "antes:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          echo "depois:"; df -h /

      - name: Create cargo deps directories
        # O build script do `sdl2-sys` copia as bibliotecas que compilou para
        # `deps/` e ASSUME que o diretorio existe. Num target dir frio -- que e o
        # que acontece quando qualquer mudanca em `Cargo.lock` invalida o cache --
        # ele ainda nao existe, e o `fs::copy` falha com um errno que o script
