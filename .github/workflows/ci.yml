name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gates:
    name: Quality gates (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        # O SDL2 "bundled" e compilado do codigo-fonte quando o cache do cargo nao
        # existe -- e qualquer mudanca em `Cargo.lock` invalida a chave. Sem
        # liberar espaco, o build script do `sdl2-sys` falha ao copiar
        # `libSDL2_test.a` com um erro de I/O que ele NAO imprime, e o sintoma e
        # "failed to run custom build command for sdl2-sys", que parece bug de
        # codigo e nao e.
        #
        # Medido: a execucao com cache passou; a sem cache falhou no mesmo
        # commit base. Os ~20 GB removidos aqui sao SDKs pre-instalados no runner
        # que este projeto nao usa.
        run: |
          echo "antes:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          echo "depois:"; df -h /

      - name: Create cargo deps directories
        # O build script do `sdl2-sys` copia as bibliotecas que compilou para
        # `deps/` e ASSUME que o diretorio existe. Num target dir frio -- que e o
        # que acontece quando qualquer mudanca em `Cargo.lock` invalida o cache --
        # ele ainda nao existe, e o `fs::copy` falha com um errno que o script
        # descarta: a mensagem sai so como "Failed to copy SDL2 dynamic library",
        # que parece bug de codigo e nao e.
        #
        # Medido: a execucao com cache passou; as sem cache falharam no mesmo
        # commit base, e o destino que aparece no panic e o de `deps/` (a copia
        # para o diretorio pai tinha acabado de dar certo).
        run: |
          mkdir -p target/debug/deps target/release/deps
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            mkdir -p "target/$triple/debug/deps" "target/$triple/release/deps"
          done

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Install build dependencies
        # One script, not a copy-pasted apt list. SDL2's bundled CMake build needs the
        # X11 headers *and* the SDL2 satellites, and a list duplicated across four jobs
        # is how both went missing. See the header of the script.
        run: sudo ./scripts/install-deps.sh

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Clippy with networking optional features
        # The workspace build does not enable `laminar`/`mdns`; without this their code
        # is only compiled by the aarch64 check, which never runs clippy.
        run: cargo clippy -p giochi-net --all-targets --all-features --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Build
        run: cargo build --workspace --target x86_64-unknown-linux-gnu

      - name: Test
        # Every integration test uses SDL's `dummy` driver, so no display is needed.
        run: cargo test --workspace --target x86_64-unknown-linux-gnu

      - name: Test with the profiling feature
        # The default build compiles the profiler and every counter out, so a test that
        # asserts the counting behaviour has to be given a build where counting exists.
        # Without this step the feature is only compiled by the perf workflow, which runs
        # one test binary.
        run: |
          cargo test -p giochi-engine --features profiling --target x86_64-unknown-linux-gnu
          cargo test -p giochi-engine-3d --features profiling --target x86_64-unknown-linux-gnu

      - name: Test with the networking optional features
        # `laminar` and `mdns` are off by default, so the workspace test step never
        # reaches them. Their tests use loopback/multicast and are cheap.
        run: cargo test -p giochi-net --all-features --target x86_64-unknown-linux-gnu

      - name: Docs
        run: cargo doc --workspace --no-deps --document-private-items

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.27.0 --locked

      - name: C header is up to date
        # giochi.h is generated from the Rust crate; a stale copy would ship an ABI that
        # does not match the library.
        run: ./scripts/gen-header.sh --check

      - name: Version is consistent
        # Cargo.toml is the source of truth; docs, header, changelog and the path
        # dependency pins must agree with it or a release misreports what it is.
        run: ./scripts/check-version.sh

      - name: SDL2 feature forwarding
        # A manifest can look correct and still resolve `sdl2-system` to a bundled
        # CMake build, because cargo unions features across the graph. Only the
        # resolution shows it, so this inspects `cargo tree`.
        run: ./scripts/check-features.sh

      - name: Build against the system SDL2
        # The one path the default build never takes: `sdl2-system` is what the console
        # image and the cross-compile use, and until now nothing compiled it. If a
        # feature ever leaks `bundled` back in, this is where it surfaces as a CMake
        # build instead of a pkg-config link.
        run: |
          cargo build -p giochi-engine-capi --target x86_64-unknown-linux-gnu \
            --no-default-features --features sdl2-system

      - name: Lint the workflow files
        # Every job here runs shell that `shellcheck` never sees, and a YAML mistake
        # only surfaces as a red X after the push that was supposed to prove the
        # change works. Pinned so the linter cannot change behaviour under us.
        run: |
          set -euo pipefail
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

      - name: Asset BMP twins are up to date
        # A target whose SDL2_image has no PNG decoder loads the .bmp twin instead
        # (ADR-036), so a stale twin is a bug that only shows up on that target.
        run: python3 scripts/png-to-bmp.py --check assets/player.png assets/checker.png

      - name: Shell scripts lint
        # Every workflow calls these instead of reimplementing them, so a broken
        # script fails all jobs at once.
        run: shellcheck scripts/*.sh

  ffi:
    name: C and Python consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        # O SDL2 "bundled" e compilado do codigo-fonte quando o cache do cargo nao
        # existe -- e qualquer mudanca em `Cargo.lock` invalida a chave. Sem
