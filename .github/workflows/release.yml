name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-arm64:
    name: Release ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - uses: Swatinem/rust-cache@v2
      - name: Build release ARM64
        run: cross build --workspace --release --target aarch64-unknown-linux-gnu
      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/giochi-demo dist/
          tar -czf dist/giochi-engine-${{ github.ref_name }}-aarch64.tar.gz \
            -C dist giochi-demo
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/giochi-engine-*.tar.gz
          generate_release_notes: true
