name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-x86_64:
    name: Build x86_64 release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install build dependencies
        run: sudo ./scripts/install-deps.sh

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        # Two invocations, not one with `--examples` added: `--examples` *filters* the
        # target selection rather than adding to it, so `--workspace --examples` builds the
        # example binaries and the libraries they need, and silently skips `giochi-demo`
        # and the `libgiochi` cdylib. That is how 0.2.0 nearly shipped a 0.1.1 library
        # under a 0.2.0 header -- caught by `verify-release-artifact.sh`, which compares
        # the archive's header against the archive's library.
        run: |
          cargo build --release --workspace --target x86_64-unknown-linux-gnu
          cargo build --release --workspace --examples --target x86_64-unknown-linux-gnu

      - name: Smoke the release binary
        # A release build is where LTO and codegen-units settings can break things that
        # a debug build tolerates.
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          ./target/x86_64-unknown-linux-gnu/release/giochi-demo --verify
          ./target/x86_64-unknown-linux-gnu/release/giochi-demo \
            lua giochi-engine-lua/examples/mini_game.lua --auto --frames 60

      - name: Package
        run: |
          mkdir -p dist/include dist/lib dist/lua
          cp target/x86_64-unknown-linux-gnu/release/giochi-demo dist/
          # The C ABI: header plus both linkable forms.
          cp giochi-engine-capi/include/giochi.h dist/include/
          cp target/x86_64-unknown-linux-gnu/release/libgiochi.so dist/lib/
          cp target/x86_64-unknown-linux-gnu/release/libgiochi.a dist/lib/
          # The 3D examples. They are separate binaries, not subcommands of the demo:
          # they need a GL context and the 2D demo deliberately never asks for one.
          mkdir -p dist/bin
          for example in cube_demo mini_fps ball_balance; do
            cp "target/x86_64-unknown-linux-gnu/release/examples/$example" dist/bin/
          done
          # The Lua binding's reference game ships with the binary that runs it.
          cp giochi-engine-lua/examples/mini_game.lua dist/lua/
          cp README.md LICENSE CHANGELOG.md PROGRESS.md dist/
          cp -r docs assets dist/
          tar -C dist -czf giochi-engine-x86_64-unknown-linux-gnu.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: giochi-engine-x86_64-unknown-linux-gnu
          path: giochi-engine-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  build-aarch64:
    name: Build aarch64 release (cross)
    # Pinned: the multiarch recipe is verified against this release's indexes, and
    # `ubuntu-latest` moving releases is exactly what broke it once.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-gnu

      - name: Install ARM64 SDL2 libraries
        # One script for both workflows: the multiarch recipe, pinned to the runner's
        # own release so the amd64 and arm64 indexes cannot disagree.
        run: sudo ./scripts/install-arm64-deps.sh

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-release

      - name: Build release for ARM64
        # Two invocations for the same reason as the x86_64 job: `--examples` filters the
        # target selection instead of adding to it.
        run: |
          ./scripts/build-aarch64.sh --release --workspace
          ./scripts/build-aarch64.sh --release --workspace --examples

      - name: Package
        run: |
          mkdir -p dist/include dist/lib dist/lua
          cp target/aarch64-unknown-linux-gnu/release/giochi-demo dist/
          cp giochi-engine-capi/include/giochi.h dist/include/
          cp target/aarch64-unknown-linux-gnu/release/libgiochi.so dist/lib/
          cp target/aarch64-unknown-linux-gnu/release/libgiochi.a dist/lib/
          mkdir -p dist/bin
          for example in cube_demo mini_fps ball_balance; do
            cp "target/aarch64-unknown-linux-gnu/release/examples/$example" dist/bin/
          done
          cp giochi-engine-lua/examples/mini_game.lua dist/lua/
          cp README.md LICENSE CHANGELOG.md PROGRESS.md dist/
          cp -r docs assets dist/
          tar -C dist -czf giochi-engine-aarch64-unknown-linux-gnu.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: giochi-engine-aarch64-unknown-linux-gnu
          path: giochi-engine-aarch64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-latest
    steps:
      # The verification steps below run repository scripts, and this job starts from an
      # empty workspace: without a checkout they fail with "No such file or directory".
      # That went unnoticed until 0.2.0 because the step was added after the previous
      # tag had already been released.
      - uses: actions/checkout@v7

      - name: Install runtime dependencies
        # The verification below compiles and *runs* the archive's C consumer, so the
        # runner needs what the archive needs: libgiochi.so has a NEEDED entry for
        # SDL2, SDL2_image and SDL2_mixer, and without them the consumer fails to link
        # with a wall of "undefined reference to SDL_*" rather than a useful message.
        run: sudo ./scripts/install-deps.sh

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release notes
        run: |
          {
            # The same expression the tag uses: a manual dispatch carries its tag in
            # `inputs.tag`, and `ref_name` would be the branch name ("main") there.
            echo "Binaries built from \`${{ github.event.inputs.tag || github.ref_name }}\`."
            echo
            echo "| Target | Asset |"
            echo "|---|---|"
            echo "| x86_64-unknown-linux-gnu | giochi-engine-x86_64-unknown-linux-gnu.tar.gz |"
            echo "| aarch64-unknown-linux-gnu | giochi-engine-aarch64-unknown-linux-gnu.tar.gz |"
            echo
            echo "Each archive contains the demo binary, the C ABI (\`include/giochi.h\`,"
            echo "\`lib/libgiochi.so\`, \`lib/libgiochi.a\`), the Lua reference game"
            echo "(\`lua/mini_game.lua\`), the docs, the assets, and the three 3D examples"
            echo "in \`bin/\` (\`cube_demo\`, \`mini_fps\`, \`ball_balance\`)."
            echo
            echo "Requires libdrm, libgbm and libEGL on the target (see docs/KMSDRM.md)."
            echo
            echo "See CHANGELOG.md for the full history, and PROGRESS.md for what was"
            echo "validated where — including which claims were checked on real hardware."
          } > release-notes.md

      - name: Check both archives are present
        run: |
          set -euo pipefail
          test -f artifacts/giochi-engine-x86_64-unknown-linux-gnu/giochi-engine-x86_64-unknown-linux-gnu.tar.gz
          test -f artifacts/giochi-engine-aarch64-unknown-linux-gnu/giochi-engine-aarch64-unknown-linux-gnu.tar.gz

      - name: Verify the x86_64 archive by running it
        # A well-formed tarball is not a working one. 0.1.0 shipped four portability bugs
        # that a run would have caught. This is now a blocking gate inside the same job
        # that creates the release, which is why the release is no longer a draft: the
        # check runs the archive's own demo, Lua game and C consumer against the archive's
        # own library, and it refuses to continue when any of them fails. It earned that
        # trust on its first real run, where it caught a 0.1.1 library under a 0.2.0
        # header and two workflow bugs that had never executed before.
        run: |
          set -euo pipefail
          ./scripts/verify-release-artifact.sh \
            artifacts/giochi-engine-x86_64-unknown-linux-gnu/giochi-engine-x86_64-unknown-linux-gnu.tar.gz

      - name: Verify the ARM64 archive layout
        # The binary cannot execute on this runner, so check the structure and prove the
        # ELF really is AArch64 rather than a host binary with a misleading name.
        #
        # This is the limit of what CI can know about the console, so validating the
        # ARM64 archive on a device is a maintainer step: run
        # `scripts/hardware-check.sh --skip-build` against the real hardware and record
        # the result in PROGRESS.md **before** pushing the tag. That is what makes the
        # automation above safe to trust without a human gating the publish.
        run: |
          set -euo pipefail
          archive=artifacts/giochi-engine-aarch64-unknown-linux-gnu/giochi-engine-aarch64-unknown-linux-gnu.tar.gz
          work="$(mktemp -d)"
          tar -C "$work" -xzf "$archive"
          for path in giochi-demo include/giochi.h lib/libgiochi.so lib/libgiochi.a \
                      lua/mini_game.lua assets/player.bmp assets/checker.bmp \
                      bin/cube_demo bin/mini_fps bin/ball_balance \
                      docs/KMSDRM.md docs/C_ABI_CONTRACT.md; do
            test -e "$work/$path" || { echo "missing: $path" >&2; exit 1; }
          done
          file "$work/giochi-demo" | grep -q 'ARM aarch64'
          file "$work/lib/libgiochi.so" | grep -q 'ARM aarch64'
          # The 3D examples are how a console user sees the renderer at all.
          for example in cube_demo mini_fps ball_balance; do
            file "$work/bin/$example" | grep -q 'ARM aarch64' \
              || { echo "not AArch64: bin/$example" >&2; exit 1; }
          done
          grep -q 'For version' "$work/include/giochi.h"
          echo "ARM64 archive layout OK"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/giochi-engine-x86_64-unknown-linux-gnu/giochi-engine-x86_64-unknown-linux-gnu.tar.gz
            artifacts/giochi-engine-aarch64-unknown-linux-gnu/giochi-engine-aarch64-unknown-linux-gnu.tar.gz
          body_path: release-notes.md
          # Not a draft: the two verification steps above are the gate, and they block.
          # A draft only helps if a human remembers to run the thing; these run it.
          draft: false
          # Deliberately off. `generate_release_notes` appends GitHub's own "What's Changed"
          # to the supplied body, and on an update it appends it to the *existing* body --
          # so re-running the release left the v0.2.0 page with the same section twice.
          # The body above is now the whole body, which makes publishing idempotent.
          generate_release_notes: false
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
