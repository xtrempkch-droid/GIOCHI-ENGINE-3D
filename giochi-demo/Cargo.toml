[package]
name = "giochi-demo"
description = "GIOCHI-ENGINE demo binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
giochi-engine = { path = "../giochi-engine", version = "0.4.0", default-features = false }
giochi-engine-lua = { path = "../giochi-engine-lua", version = "0.4.0", default-features = false }
env_logger = { workspace = true }
log = { workspace = true }

[features]
# O binário é o que `scripts/build-aarch64.sh` compila, então ele também precisa
# conseguir escolher o SDL2: `--no-default-features --features sdl2-system`.
default = ["sdl2-bundled"]
sdl2-bundled = ["giochi-engine/sdl2-bundled", "giochi-engine-lua/sdl2-bundled"]
sdl2-system = ["giochi-engine/sdl2-system", "giochi-engine-lua/sdl2-system"]
# Encaminha a feature de profiling do core para que o exemplo possa usá-la.
profiling = ["giochi-engine/profiling"]
# Fase 19: reiniciar o script Lua quando o arquivo muda. Sem ela o demo roda igual,
# só não recarrega.
hot_reload = ["giochi-engine-lua/hot_reload"]

[[example]]
name = "profiler_demo"
path = "examples/profiler_demo.rs"
