[package]
name = "giochi-demo"
description = "GIOCHI-ENGINE demo binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
giochi-engine = { path = "../giochi-engine", version = "0.2.2" }
giochi-engine-lua = { path = "../giochi-engine-lua", version = "0.2.2" }
env_logger = { workspace = true }
log = { workspace = true }

[features]
# Encaminha a feature de profiling do core para que o exemplo possa usá-la.
profiling = ["giochi-engine/profiling"]

[[example]]
name = "profiler_demo"
path = "examples/profiler_demo.rs"
