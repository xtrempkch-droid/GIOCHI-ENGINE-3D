[workspace]
resolver = "2"
members = [
    "giochi-engine",
    "giochi-demo",
    "giochi-engine-capi",
    "giochi-engine-lua",
    "giochi-engine-3d",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
# Verified floor, not an aspiration: mlua 0.10 needs 1.79, `size_of` in the prelude
# (used by tests/abi_layout.rs) needs 1.80, and 1.82 is the oldest toolchain verified to
# build the whole workspace. Checked with `cargo +<version> build --workspace`; raising a
# dependency can raise this, so probe again when you bump one.
rust-version = "1.82"
license = "MIT"
authors = ["GIOCHI-SYSTEM contributors"]
repository = "https://github.com/xtrempkch-droid/GIOCHI-SYSTEM"

[workspace.dependencies]
# `unsafe_textures` drops the lifetime from `sdl2::render::Texture`, which is what
# lets textures live in an opaque `u64` handle registry instead of being borrowed
# from the canvas. See ADR-017 in docs/DECISIONS.md.
# `bundled` deixou de ser obrigatório aqui: no aparelho o SDL2 vem da imagem
# (Buildroot, com KMSDRM) e compilar do código-fonte exigiria cmake e uma segunda
# cópia no rootfs. Cada crate escolhe com a feature `sdl2-system`. O padrão
# continua sendo `bundled`, então quem não pede nada não muda de comportamento.
sdl2 = { version = "0.38", default-features = false, features = ["image", "mixer", "ttf", "unsafe_textures"] }
glam = "0.29"
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
cbindgen = "0.27"
# 3D (phases 9–14). `glow` is a thin GL/GLES binding: it declares the functions and
# lets the loader supply the pointers, without tying us to a windowing library.
glow = "0.14"
bytemuck = { version = "1", features = ["derive"] }
tobj = "4"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
