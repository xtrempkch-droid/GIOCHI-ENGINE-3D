[workspace]
resolver = "2"
members = [
    "giochi-engine",
    "giochi-demo",
    "giochi-engine-capi",
    "giochi-engine-lua",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["GIOCHI-SYSTEM contributors"]
repository = "https://github.com/xtrempkch-droid/GIOCHI-SYSTEM"

[workspace.dependencies]
sdl2 = { version = "0.38", features = ["bundled", "image", "mixer", "ttf"] }
glam = "0.29"
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
cbindgen = "0.27"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
