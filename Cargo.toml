[workspace]
resolver = "2"
members = [
    "giochi-engine",
    "giochi-demo",
    "giochi-engine-capi",
    "giochi-engine-lua",
    "giochi-engine-3d",
    "giochi-net",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
# Verified floor, and deliberately not one number for the whole workspace.
#
# This value is the default for crates that do not override it: `giochi-engine-lua` and
# `giochi-demo` (which depends on it). `mlua` 0.12 and its `mlua-sys` 0.13 declare 1.88,
# and 1.87 is rejected:
#
#   cargo +1.87.0 check -p giochi-engine-lua
#   -> "mlua-sys@0.13.0 requires rustc 1.88"
#
# The other four crates declare **1.86** in their own manifest, because a distribution's
# packaged Rust is often a release or two behind and there is no reason for a C-ABI
# consumer to need the Lua binding's floor. Measured on 1.86.0 with
# `cargo +1.86.0 test -p giochi-engine -p giochi-engine-3d -p giochi-engine-capi
#  -p giochi-net`; the constraint there is `criterion` 0.8 (1.86) as a dev-dependency —
# `glam` 0.34 needs only 1.85. Raising a dependency can raise this, so probe again when
# you bump one — ADR-046.
rust-version = "1.88"
license = "MIT"
authors = ["GIOCHI-SYSTEM contributors"]
repository = "https://github.com/xtrempkch-droid/GIOCHI-SYSTEM"

[workspace.dependencies]
# `unsafe_textures` drops the lifetime from `sdl2::render::Texture`, which is what
# lets textures live in an opaque `u64` handle registry instead of being borrowed
# from the canvas. See ADR-017 in docs/DECISIONS.md.
# `bundled` deixou de ser obrigatório aqui: no aparelho o SDL2 vem da imagem
# (Buildroot, com KMSDRM) e compilar do código-fonte exigiria cmake e uma segunda
# cópia no rootfs. Cada crate escolhe com a feature `sdl2-system`. O padrão
# continua sendo `bundled`, então quem não pede nada não muda de comportamento.
sdl2 = { version = "0.38", default-features = false, features = ["image", "mixer", "ttf", "unsafe_textures"] }
glam = "0.34"
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
cbindgen = "0.27"
# Phase 16: statistical benchmarks. The `html_reports` feature is what phase 18's
# performance CI uses to compare a branch against `main`.
criterion = { version = "0.8", features = ["html_reports"] }
# 3D (phases 9–14). `glow` is a thin GL/GLES binding: it declares the functions and
# lets the loader supply the pointers, without tying us to a windowing library.
glow = "0.18"
bytemuck = { version = "1", features = ["derive"] }
tobj = "4"
# Phase 19. `notify` 6 rather than 7 or 8: it declares MSRV 1.60, so turning on
# `hot_reload` does not raise the engine's measured 1.86 floor (ADR-046). The API used
# here (`recommended_watcher`, `Watcher::watch`) has not changed since 5.
notify = "6"

# Phase 18a. Shipping build for the consoles.
#
# `lto = "fat"` rather than `"thin"`: the console payload is a handful of binaries
# linked once per release, so the extra link time is paid a few times and never by a
# player, while whole-program optimisation across the engine/capi boundary is where the
# wins are (everything goes through `#[repr(C)]` structs and `catch_unwind` guards, all
# of which thin LTO tends to leave as opaque calls).
#
# `strip = "symbols"` is free size and free time: the console deployment copies a
# binary, runs it, and reads its output. Symbols were never part of the artifact.
#
# `panic = "unwind"` is the default and MUST stay that way. `giochi-engine-capi` wraps
# every exported function in `catch_unwind` so that a Rust panic becomes
# `GIOCHI_ERROR_INTERNAL` instead of tearing down the host application — that is a
# documented guarantee in `docs/C_ABI_CONTRACT.md`, not an implementation detail, and
# `abort` would silently turn every such bug into a process kill inside a game that
# embeds the engine. The plan allowed keeping `unwind` at a cost of roughly 5% of the
# size; the measured cost is in `docs/PERF_LOG.md` under "After Phase 18".
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"

# Phase 18b. Benchmarks are compiled like the shipping build (`lto`, one codegen unit,
# `-O3`) but keep debug info on purpose: `cargo bench` profiles are only actionable if
# the profiler can resolve the frames, and a stripped benchmark measures a binary
# nobody ships. `lto = "thin"` keeps criterion's edit-benchmark loop affordable — the
# benchmark numbers are not the artifact, so the last percent of codegen quality is not
# worth minutes per iteration.
[profile.bench]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = true
